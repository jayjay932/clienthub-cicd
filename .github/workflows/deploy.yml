name: ClientHub CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r api/requirements.txt pytest
      - run: python -m pytest tests/test_unit.py

  e2e-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest requests

      - name: Demarrer l'application
        run: |
          docker build -t clienthub-test ./api
          docker run -d --name app-test -p 5002:5000 clienthub-test

      - name: Attendre que l'API soit disponible
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5002/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs app-test
          exit 1

      - run: python -m pytest tests/test_e2e.py

      - name: Nettoyer le conteneur
        if: always()
        run: docker rm -f app-test || true

  build-push:
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/clienthub-api
    steps:
      - uses: actions/checkout@v6

      - name: Connexion a Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" |
            docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Construire et publier l'image
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" ./api
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Deconnexion
        if: always()
        run: docker logout