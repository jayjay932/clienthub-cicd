name: ClientHub CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r api/requirements.txt pytest
      - run: python -m pytest tests/test_unit.py

  e2e-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest requests

      - name: Demarrer l'application
        run: |
          docker build -t clienthub-test ./api
          docker run -d --name app-test -p 5002:5000 clienthub-test

      - name: Attendre que l'API soit disponible
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5002/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs app-test
          exit 1

      - run: python -m pytest tests/test_e2e.py

      - name: Nettoyer le conteneur
        if: always()
        run: docker rm -f app-test || true

  build-push:
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/clienthub-api
    steps:
      - uses: actions/checkout@v6

      - name: Connexion a Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" |
            docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Construire et publier l'image
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" ./api
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Deconnexion
        if: always()
        run: docker logout
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    concurrency:
      group: clienthub-azure
      cancel-in-progress: false
    env:
      AZURE_HOST: ${{ secrets.AZURE_HOST }}
      AZURE_USER: ${{ secrets.AZURE_USER }}
      AZURE_SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
      AZURE_KNOWN_HOSTS: ${{ secrets.AZURE_KNOWN_HOSTS }}
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/clienthub-api
    steps:
      - name: Configurer SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AZURE_SSH_KEY" > ~/.ssh/clienthub
          printf '%s\n' "$AZURE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/clienthub ~/.ssh/known_hosts

      - name: Deployer sur Azure
        run: |
          ssh -i ~/.ssh/clienthub -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$AZURE_USER@$AZURE_HOST" \
            bash -s -- "$IMAGE:$GITHUB_SHA" <<'REMOTE'
          set -eu
          docker pull "$1"
          if docker container inspect clienthub-jason >/dev/null 2>&1; then
            docker rm -f clienthub-jason
          fi
          docker run -d --name clienthub-jason --restart unless-stopped \
            -p 8023:5000 "$1"

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8023/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs clienthub-jason
          exit 1
          REMOTE

      - name: Verifier l'acces public
        run: |
          curl --fail --show-error --retry 5 --retry-connrefused \
            --connect-timeout 10 --max-time 20 \
            "http://$AZURE_HOST:8023/health"
